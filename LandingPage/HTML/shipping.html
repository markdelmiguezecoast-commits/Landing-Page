<!DOCTYPE html>
<html>
    <head>
        <title>Shipping Details | Parfum de Akairu</title>
        <link rel="stylesheet" href="../CSS/shipping.css">
        <body>

            <div class="navbar">
                <table cellpadding="15">
                    <tr>
                        <td width="40%">
                            <span class="brand">Parfum de Akaru</span>
                        </td>
                        <td align="right">
                            <a href="main.html">Home</a> |
                            <a href="Shop.html">Shop</a> |
                            <a href="main.html#about">About</a> |
                            <a href="main.html#Contact">Contact</a>
                        </td>
                    </tr>
                </table>
            </div>

            <div class="shipping-header"> 
                <h1> Shipping Details</h1>
                <p>Let us know where to send your fragrance</p>
            </div>

            <div class="shipping-box">
                <form>
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Juan Dela Cruz">

                    <label for="address">Street Address</label>
                    <input type="text" id="address" placeholder="123 Kahit saan Street">

                    <label for="city">City</label>
                    <input type="text" id="city" placeholder="Dito Samin City">

                    <label for="zip">Zip Code</label>
                    <input type="text" id="zip" placeholder="6767">

                    <label for="phone">Phone Number</label>
                    <input type="number" id="phone" placeholder="09XX XXX XXXX">

                    <a href="../HTML/confirmation.html">
                        <button type="button" class="place-order-button">
                            PLACE ORDER
                        </button>
                    </a>
                </form>
            </div>

            <div class="footer">
                <p>PARFUM de AKAIRU © 2026</p>
                <p>Your Scent. Your Identity.</p>
            </div>
        </body>
    </head>
</html>
