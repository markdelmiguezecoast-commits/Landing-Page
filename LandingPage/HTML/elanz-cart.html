<!DOCTYPE html>
<html>
    <head>
        <title>Rose Élanz | Cart</title>
        <link rel="stylesheet" href="../css/cart.css">
    </head>
    <body>
        <div class="navbar">
            <table cellpadding="15">
                <tr>
                    <td width="40%">
                        <span class="brand">Parfum de Akairu</span>
                    </td>
                    <td align="right">
                        <a href="main.html">Home</a> |
                        <a href="Shop.html">Shop</a> |
                        <a href="main.html#about">About</a> |
                        <a href="main.html#Contact">Contact</a>
                    </td>
                </tr>
            </table>
        </div>

        <div class="cart-header">
            <h1>Your Cart</h1>
            <p>Review your item before checking out.</p>
        </div>

        <div class="cart-box">
            <table class="cart-table" width="100%" cellpadding="15">
                <tr>
                    <th>Product</th>
                    <th>Notes</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Subtotal</th>
                </tr>

                <tr>
                    <td>
                        <img src="../image/elanz.png" alt="Rose Élanz Perfume" class="cart-img">
                        Rose Élanz
                    </td>
                    <td>Rose · Jasmine · Vanilla</td>
                    <td>₱1,499</td>
                    <td>1</td>
                    <td>₱1,499</td>
                </tr>
            </table>

            <div class="cart-total">
                <p>Total: <span>₱1,499</span></p>
            </div>

            <div class="cart-buttons">
                <a href="Shop.html">
                    <button class="return-button">CONTINUE SHOPPING</button>
                </a>

                <a href="shipping.html">
                    <button class="checkout-button">CHECKOUT</button>
                </a>
            </div>

        </div>

        <div class="footer">
            <p>PARFUM de AKAIRU © 2026</p>
            <p>Your Scent. Your Identity.</p>
        </div>
    </body>
</html>
