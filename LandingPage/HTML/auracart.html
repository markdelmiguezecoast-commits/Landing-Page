<!DOCTYPE html>
<html>
    <head>
        <title>Ken Aura | Cart</title>
        <link rel="stylesheet" href="../CSS/cart.css">
    </head>
    
    <body>
        <div class="navbar">
            <table cellpadding="15">
                <tr>
                    <td width="40%">
                        <span class="brand"> Parfum de Akairu</span>
                    </td>

                    <td align="right">
                        <a href="main.html">Home</a> |
                        <a href="Shop.html">Shop</a> |
                        <a href="main.html#about">About</a> |
                        <a href="main.html#contact">Contact</a>
                    </td>
                </tr>
            </table>
        </div>

        <div class="cart-header">
            <h1>Your Cart</h1>
            <p>Review your item before checking out</p>
        </div>

        <div class="cart-box">
            <table class="cart-table" width="100%" cellpadding="15">
                <tr>
                    <th>Product</th>
                    <th>Notes</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Subtotal</th>
                </tr>

                <tr>
                    <td>
                        <img src="..//image/aura.png" alt="Ken Aura Perfume" class="cart-img">
                        Ken Aura
                    </td>
                    <td>Bergamot · Citrus · Musk</td>
                    <td>₱1,399</td>
                    <td>1</td>
                    <td>₱1,399</td>
                </tr>
            </table>

            <div class="cart-total">
                <p>Total: <span>₱1,399</span></p>
            </div>

            <div class="cart-buttons">
                <a href="..//HTML/Shop.html">
                    <button class="return-button">CONTINUE SHOPPING</button>
                </a>

                <a href="..//HTML/shipping.html">
                    <button class="checkout-button">CHECKOUT</button>
                </a>
            </div>

        </div>

        <div class="footer">
            <p>PARFUM de AKAIRU © 2026</p>
            <p>Your Scent. Your Identity.</p>
        </div>
    </body>
</html>
